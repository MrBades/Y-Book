    <script>
      // Immediately handle asset loading failures (e.g. stale PWA cache pointing to old hashes)
      window.addEventListener('error', (e) => {
        const target = e.target;
        if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
          console.warn('⚡ Asset load failed. Purging PWA caches and reloading page...', target.src || target.href);
          if ('serviceWorker' in navigator) {
            caches.keys().then((names) => {
              return Promise.all(names.map(name => caches.delete(name)));
            }).then(() => {
              navigator.serviceWorker.getRegistrations().then((registrations) => {
                for (let registration of registrations) {
                  registration.unregister();
                }
                window.location.reload();
              });
            }).catch(() => {
              window.location.reload();
            });
          } else {
            window.location.reload();
          }
        }
      }, true);

      window.addEventListener('vite:preloadError', (e) => {
        console.warn('⚡ Vite preloadError detected. Purging PWA caches and reloading...');
        if ('serviceWorker' in navigator) {
          caches.keys().then((names) => {
            return Promise.all(names.map(name => caches.delete(name)));
          }).then(() => {
            navigator.serviceWorker.getRegistrations().then((registrations) => {
              for (let registration of registrations) {
                registration.unregister();
              }
              window.location.reload();
            });
          }).catch(() => {
            window.location.reload();
          });
        } else {
          window.location.reload();
        }
      });
    </script>
